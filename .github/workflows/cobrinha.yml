
name: generate animation

on:
  # run automatically every 24 hours
  schedule:
    - cron: "0 */24 * * *" 
  
  # allows to manually run the job at any time
  workflow_dispatch:
  
  # run on every push on the master branch
  push:
    branches:
    - master

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Halloween Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
                      
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#f28c18&color_dots=#e4e4e4,#ffd84a,#ffbd21,#f28c18,#171717
            dist/github-contribution-grid-snake-dark.svg?color_snake=#f28c18&color_dots=#303030,#ffd84a,#ffbd21,#f28c18,#171717



        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
